<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="DevVault — save the commands, snippets and fixes you learn, then find them again in seconds."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>DevVault</title>
    <script>
      // Apply the theme before first paint to avoid a flash
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem('devvault-theme');
        } catch (e) {}
        var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.classList.toggle('dark', dark);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
