services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: devvault
      POSTGRES_PASSWORD: devvault
      POSTGRES_DB: devvault
    ports:
      - '5432:5432'
    volumes:
      - devvault-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U devvault']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  devvault-db:
